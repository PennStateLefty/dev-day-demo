[project]
name = "agentic-sdlc-demo"
version = "0.1.0"
description = "Synthetic claims triage demo with REST, MCP, and evaluation baselines"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "fastmcp>=3.2,<4",
    "jsonschema[format]>=4.23,<5",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
pythonpath = ["src/apps/claims-api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
